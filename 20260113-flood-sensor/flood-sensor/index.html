<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>水浸传感器数据监测平台</title>
    <script src="./echarts.min.js"></script>
    <style>
        /* Global Styles & Vercel-like Theme */
        :root {
            --bg-color: #fafafa;
            --card-bg: #ffffff;
            --text-primary: #000000;
            --text-secondary: #666666;
            --border-color: #eaeaea;
            --hover-border: #000000;
            --accent-blue: #0070f3;
            --accent-red: #e00000;
            --accent-green: #008f28;
            --shadow-sm: 0 2px 4px rgba(0,0,0,0.02);
            --shadow-hover: 0 5px 10px rgba(0,0,0,0.12);
            --font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            --radius: 8px;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 24px;
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        .dashboard-container {
            width: 100%;
            max-width: 1200px;
            display: flex;
            flex-direction: column;
            gap: 24px;
        }

        /* Header */
        header {
            padding-bottom: 8px;
        }

        h1 {
            font-size: 24px;
            font-weight: 700;
            color: var(--accent-blue);
            margin: 0;
            letter-spacing: -0.5px;
        }

        /* Card Component */
        .card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: var(--radius);
            padding: 24px;
            box-shadow: var(--shadow-sm);
            transition: all 0.2s ease;
        }

        .card:hover {
            box-shadow: var(--shadow-hover);
            border-color: #ddd;
        }

        /* Stats Grid */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 12px;
        }

        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 12px;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            letter-spacing: -1px;
            line-height: 1;
        }

        .text-red { color: var(--accent-red); }
        .text-green { color: var(--accent-green); }

        /* Section Titles */
        .section-header {
            font-size: 16px;
            font-weight: 600;
            margin-bottom: 20px;
            color: #333;
        }

        /* Data Table */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 14px;
        }

        th {
            text-align: left;
            padding: 16px 24px;
            color: var(--text-secondary);
            font-weight: 500;
            border-bottom: 1px solid var(--border-color);
            background: #fafafa;
        }

        th:first-child { border-top-left-radius: var(--radius); }
        th:last-child { border-top-right-radius: var(--radius); }

        td {
            padding: 16px 24px;
            border-bottom: 1px solid var(--border-color);
            color: #333;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .status-badge {
            font-weight: 500;
        }
        
        .status-alarm { color: var(--accent-red); }
        .status-normal { color: var(--accent-green); }

        /* Chart */
        .chart-box {
            height: 400px;
            width: 100%;
        }

        /* Mobile Optimization */
        @media (max-width: 768px) {
            body {
                padding: 12px;
            }
            
            .dashboard-container {
                gap: 16px;
            }

            .stats-grid {
                grid-template-columns: repeat(2, 1fr); /* 手机上一行显示两个 */
                gap: 12px;
            }
            
            h1 {
                font-size: 20px;
            }

            .stat-value {
                font-size: 24px;
            }

            .card {
                padding: 16px;
            }
            
            th, td {
                padding: 12px 16px;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <header>
            <h1>水浸传感器数据监测平台</h1>
        </header>

        <!-- Top Stats -->
        <div class="stats-grid">
            <div class="card stat-item">
                <div class="stat-label">在线传感器数</div>
                <div class="stat-value">12</div>
            </div>
            <div class="card stat-item">
                <div class="stat-label">水浸告警数</div>
                <div class="stat-value text-red">2</div>
            </div>
            <div class="card stat-item">
                <div class="stat-label">正常运行数</div>
                <div class="stat-value text-green">10</div>
            </div>
            <div class="card stat-item">
                <div class="stat-label">今日监测次数</div>
                <div class="stat-value">286</div>
            </div>
        </div>

        <!-- Real-time Data Table -->
        <div class="card">
            <div class="section-header">传感器实时数据</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>传感器编号</th>
                            <th>安装位置</th>
                            <th>检测状态</th>
                            <th>最新更新时间</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr style="cursor: pointer;" onclick="window.location.href='detail1.html'">
                            <td><span style="color: var(--accent-blue); font-weight: bold;">S001</span></td>
                            <td>1号逆变器</td>
                            <td><span class="status-badge status-alarm">水浸告警</span></td>
                            <td>2026-01-13 10:25:30</td>
                        </tr>
                        <tr style="cursor: pointer;" onclick="window.location.href='detail2.html'">
                            <td><span style="color: var(--accent-blue); font-weight: bold;">S002</span></td>
                            <td>2号逆变器</td>
                            <td><span class="status-badge status-alarm">水浸告警</span></td>
                            <td>2026-01-13 10:20:15</td>
                        </tr>
                        <tr style="cursor: pointer;" onclick="window.location.href='detail3.html'">
                            <td><span style="color: var(--accent-blue); font-weight: bold;">S003</span></td>
                            <td>3号逆变器</td>
                            <td><span class="status-badge status-normal">正常</span></td>
                            <td>2026-01-13 10:18:40</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Trend Chart -->
        <div class="card">
            <div class="section-header">近7天水浸检测趋势</div>
            <div id="trendChart" class="chart-box"></div>
        </div>
    </div>

    <script>
        // Initialize ECharts
        document.addEventListener('DOMContentLoaded', function() {
            var chartDom = document.getElementById('trendChart');
            var myChart = echarts.init(chartDom);
            var option;

            // 生成更密集的波浪数据
            var xData = [];
            var yData = [];
            for (var i = 0; i < 50; i++) {
                xData.push('10:' + (i < 10 ? '0' + i : i));
                // 模拟波浪：加大振幅 (由 *2 改为 *3.5)，加大随机扰动 (由 *1.5 改为 *2.5)
                var val = Math.sin(i / 5) * 3.5 + Math.random() * 2.5 + 4;
                // 确保不出现负数，虽然在这个公式下不太可能，但为了保险
                if (val < 0) val = 0;
                yData.push(val.toFixed(2));
            }

            option = {
                color: ['#0070f3'], // 改用蓝色，更有“水”的感觉
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: 'rgba(255, 255, 255, 0.95)',
                    borderColor: '#eaeaea',
                    padding: [10, 15],
                    textStyle: {
                        color: '#333'
                    },
                    formatter: function(params) {
                        return params[0].name + '<br/>' + 
                               '<span style="display:inline-block;margin-right:5px;border-radius:10px;width:10px;height:10px;background-color:#0070f3;"></span>' +
                               '水位监测: <b>' + params[0].value + ' cm</b>';
                    }
                },
                legend: {
                    data: ['水位波动'],
                    right: 0,
                    icon: 'circle'
                },
                grid: {
                    left: '20',
                    right: '30',
                    bottom: '20',
                    top: '40',
                    containLabel: true
                },
                xAxis: {
                    type: 'category',
                    boundaryGap: false,
                    data: xData,
                    axisLine: {
                        lineStyle: { color: '#eaeaea' }
                    },
                    axisTick: { show: false },
                    axisLabel: {
                        color: '#888',
                        interval: 8 // 减少标签显示，避免拥挤
                    }
                },
                yAxis: {
                    type: 'value',
                    name: '水位 (cm)',
                    nameTextStyle: { color: '#888', padding: [0, 0, 0, 20] },
                    splitLine: {
                        lineStyle: {
                            color: '#f5f5f5',
                            type: 'dashed'
                        }
                    },
                    axisLabel: { color: '#888' }
                },
                series: [
                    {
                        name: '水位波动',
                        type: 'line',
                        smooth: true, // 开启平滑，让线条像波浪
                        showSymbol: false,
                        symbolSize: 0,
                        itemStyle: {
                            color: '#0070f3',
                        },
                        lineStyle: {
                            width: 3,
                            shadowColor: 'rgba(0,112,243, 0.3)',
                            shadowBlur: 10,
                            shadowOffsetY: 5
                        },
                        areaStyle: {
                            color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [
                                { offset: 0, color: 'rgba(0,112,243, 0.2)' },
                                { offset: 1, color: 'rgba(0,112,243, 0)' }
                            ])
                        },
                        data: yData
                    }
                ]
            };

            myChart.setOption(option);

            // Responsive Resize
            window.addEventListener('resize', function() {
                myChart.resize();
            });
        });
    </script>
</body>
</html>
